# golemd operator configuration. Model IDs are opaque and nested under the
# harness that offers them.
name = "local"
clone_enabled = false
# Required when --listen binds beyond loopback. Every TCP request (including
# SSE) must then send Authorization: Bearer TOKEN. Unix sockets stay exempt.
# Empty is allowed only for a loopback listener and logs a development warning.
api_bearer_tokens = []

[providers.openai]
base_url = "https://api.openai.com/v1"
api_key_env = "" # Set to an environment variable name to enable auth.

[harnesses.fake]
models = []

[harnesses.pi]
# Static providers remain explicit. This list may be empty when Tiamat
# discovery below supplies Pi models; it is not an exhaustive Router inventory.
models = ["openai/gpt-5.6"]

# Optional dynamic Tiamat discovery. Section presence enables it only for the
# already-configured Pi harness. The Router endpoint and read-only client token
# path come from GOLEM_TIAMAT_URL and GOLEM_TIAMAT_TOKEN_FILE; no secret belongs
# in this file. Empty providers/models lists allow all compatible available or
# degraded entries. providers are Router provider names; models are exact
# advertised tiamat-{family}-{encoded-provider}/{model} IDs. Both restrictions,
# when present, must match.
# [tiamat]
# providers = ["astra/personal"]
# models = []
# cache_ttl = "30s"
# stale_ttl = "10m"
# timeout = "5s"
# max_models = 1000
# max_response_bytes = 2097152

[harnesses.claude]
models = ["anthropic/claude-sonnet-4"]

# Project paths must be absolute existing directories. Dispatch selects these
# by name and uses a durable worktree name as its resume key.
[projects.scratch]
path = "/tmp"
description = "Local scratch space"

# Optional restricted SSH terminal attach endpoint. Port 0 (or an absent
# section) disables it. The host key is generated once if absent; authorized
# client keys use standard OpenSSH authorized_keys format.
[attach_ssh]
port = 0
host_key_path = "/tmp/golemd-attach-host-key"
authorized_keys_path = "/tmp/golemd-authorized-keys"

# Optional private Herdr substrate. Absent (the default) means golemd's tmux
# backend. Present makes golemd start, monitor, and stop its own Herdr child;
# it never attaches to the user's Herdr. Startup failure or protocol mismatch
# logs HERDR BACKEND UNAVAILABLE, FALLING BACK TO TMUX. Only pi runs on this
# backend today; attach/steer are 501.
# [herdr]
# root = "/var/lib/golem/herdr"  # default: STATE/herdr; private XDG/HOME/data
# binary = "/path/to/herdr"      # default: bundled binary in the Nix package
# session = "golem"              # explicit private session (default: golem)
# shell = "/bin/sh"              # must be profile-less; Nix bundles a no-rc bash
# server_startup_timeout = "15s"
# startup_timeout_ms = 60000      # bounds agent.start (3000..300000)
# reconcile_interval = "15s"      # safety-net agent.list poll
# [herdr.kinds]                    # golem harness -> herdr agent kind
# pi = "pi"
#
# Golemd uses the selected binary to install Pi's lifecycle extension once at
# ROOT/pi-seed, then copies it into every private job profile. Normally there
# is no pi_extension setting and no manual provisioning. Generated Herdr config
# enforces a non-login profile-less shell, resume_agents_on_restore=false, and
# version_check/manifest_check=false.
