# golemd operator configuration. Model IDs are opaque and nested under the
# harness that offers them.
name = "local"
clone_enabled = false
# Required when --listen binds beyond loopback. Every TCP request (including
# SSE) must then send Authorization: Bearer TOKEN. Unix sockets stay exempt.
# Empty is allowed only for a loopback listener and logs a development warning.
api_bearer_tokens = []

[providers.openai]
base_url = "https://api.openai.com/v1"
api_key_env = "" # Set to an environment variable name to enable auth.

[harnesses.fake]
models = []

[harnesses.pi]
models = ["openai/gpt-5.6"]

[harnesses.claude]
models = ["anthropic/claude-sonnet-4"]

# Project paths must be absolute existing directories. Dispatch selects these
# by name and uses a durable worktree name as its resume key.
[projects.scratch]
path = "/tmp"
description = "Local scratch space"

# Optional restricted SSH terminal attach endpoint. Port 0 (or an absent
# section) disables it. The host key is generated once if absent; authorized
# client keys use standard OpenSSH authorized_keys format.
[attach_ssh]
port = 0
host_key_path = "/tmp/golemd-attach-host-key"
authorized_keys_path = "/tmp/golemd-authorized-keys"

# Optional Herdr run substrate. Absent (the default) means golemd's own private
# tmux server, unchanged. Present means golemd pings this session socket at
# startup, requires protocol 20, and — if either check fails — logs
# HERDR BACKEND UNAVAILABLE, FALLING BACK TO TMUX and comes up on tmux anyway.
# On this backend only pi runs (other harnesses are 400 at dispatch) and
# attach/steer are 501; reach a job with `herdr agent attach job-<id>` over SSH.
# [herdr]
# session = "golem"              # -> ~/.config/herdr/sessions/golem/herdr.sock
# socket = ""                    # explicit socket path; wins over session
# startup_timeout_ms = 60000     # bounds agent.start (3000..300000)
# reconcile_interval = "15s"     # safety-net agent.list poll
# pi_extension = "/var/lib/golem/herdr-pi-seed/extensions/herdr-agent-state.ts"
# [herdr.kinds]                  # golem harness -> herdr agent kind
# pi = "pi"
#
# Install the Pi lifecycle extension into a stable seed (never a worker dir):
# fort-nix (adapt the service owner elsewhere):
#   sudo install -d -o familiar -g users -m 0700 /var/lib/golem/herdr-pi-seed
#   sudo -u familiar env PI_CODING_AGENT_DIR=/var/lib/golem/herdr-pi-seed \
#     herdr integration install pi
# Then set pi_extension above to the exact resulting path. Golem copies those
# bytes into each private worker profile and explicitly allowlists that copy.
# Other Herdr-side requirements: a pinned version and a pane shell that does
# not replace the PATH golemd puts in the workspace env (Herdr resolves the
# harness executable through it):
#   [terminal]
#   default_shell = "/path/to/a/shell/that/runs/no/profile"
